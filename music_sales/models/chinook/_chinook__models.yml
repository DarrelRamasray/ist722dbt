# =====================================================================
# _chinook__models.yml
# Location: music_sales/models/chinook/ in the ist722dbt repository
# What it does: describes the six Music Sales models and adds a data test
#   for every PK, unique and not_null tick in the design sheets, plus a
#   relationships test for every FK Ref Dimension.col in fact_sale.
# Design: 1. Bus_MatrixV7_simplified.xlsx
# =====================================================================

version: 2

models:
  - name: fact_sale
    description: "One row per track sold on an invoice line; each row is unique by invoicelineid."
    columns:
      - name: invoicelineid
        description: "Source key used for drill-through"
        data_tests:
          - unique
          - not_null
      - name: invoiceid
        description: "Degenerate dimension; the invoice number"
        data_tests:
          - not_null
      - name: invoicekey
        description: "Dimension FK for dim_invoice"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_invoice')
                field: invoicekey
      - name: trackkey
        description: "Dimension FK for dim_track; Gives name, genre, media type, artist, album"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_track')
                field: trackkey
      - name: customerkey
        description: "Dimension FK for dim_customer"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customerkey
      - name: employeekey
        description: "Dimension FK for dim_employee; the customer's support rep"
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_employee')
                field: employeekey
      - name: invoicedatekey
        description: "Dimension FK for dim_date; the invoice date"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: datekey
      - name: unitprice
        description: "Unit price of the track; Non-additive; Unit price is used for averaging."
        data_tests:
          - not_null
      - name: quantity
        description: "Number of units sold; Additive"
        data_tests:
          - not_null
      - name: saleamount
        description: "Unit price * quantity; Additive"
        data_tests:
          - not_null

  - name: dim_date
    description: "One row per calendar day, from the first to the last invoice date."
    columns:
      - name: datekey
        description: "Dimension key; the calendar date"
        data_tests:
          - unique
          - not_null
      - name: year
        description: "Calendar year"
        data_tests:
          - not_null
      - name: quarter
        description: "Calendar quarter (1-4)"
        data_tests:
          - not_null
      - name: month
        description: "Month number (1-12)"
        data_tests:
          - not_null
      - name: monthname
        description: "Month name"
        data_tests:
          - not_null
      - name: dayofmonth
        description: "Day of the month"
        data_tests:
          - not_null
      - name: dayofweek
        description: "Day of the week (1 = Monday)"
        data_tests:
          - not_null
      - name: dayname
        description: "Day name"
        data_tests:
          - not_null

  - name: dim_employee
    description: "One row per employee."
    columns:
      - name: employeekey
        description: "Dimension key"
        data_tests:
          - unique
          - not_null
      - name: employeeid
        description: "Primary key of the source system table"
        data_tests:
          - unique
          - not_null
      - name: lastname
        description: "Employee's last name"
        data_tests:
          - not_null
      - name: firstname
        description: "Employee's first name"
        data_tests:
          - not_null
      - name: title
        description: "Employee's job title"
      - name: reportsto
        description: "Employee ID of the employee's manager"
      - name: birthdate
        description: "Employee's birth date"
      - name: hiredate
        description: "Employee's hire date"
      - name: address
        description: "Employee's street address"
      - name: city
        description: "Employee's city"
      - name: state
        description: "Employee's state or province"
      - name: country
        description: "Employee's country"
      - name: postalcode
        description: "Employee's postal code"
      - name: phone
        description: "Employee's phone number"
      - name: fax
        description: "Employee's fax number"
      - name: email
        description: "Employee's email address"

  - name: dim_customer
    description: "One row per customer."
    columns:
      - name: customerkey
        description: "Dimension key"
        data_tests:
          - unique
          - not_null
      - name: customerid
        description: "Primary key of the source system table"
        data_tests:
          - unique
          - not_null
      - name: firstname
        description: "Customer's first name"
        data_tests:
          - not_null
      - name: lastname
        description: "Customer's last name"
        data_tests:
          - not_null
      - name: company
        description: "Customer's company"
      - name: address
        description: "Customer's street address"
      - name: city
        description: "Customer's city"
      - name: state
        description: "Customer's state or province"
      - name: country
        description: "Customer's country"
      - name: postalcode
        description: "Customer's postal code"
      - name: phone
        description: "Customer's phone number"
      - name: fax
        description: "Customer's fax number"
      - name: email
        description: "Customer's email address"
        data_tests:
          - not_null
      - name: supportrepid
        description: "Employee ID of the customer's support rep"

  - name: dim_invoice
    description: "One row per invoice."
    columns:
      - name: invoicekey
        description: "Dimension key"
        data_tests:
          - unique
          - not_null
      - name: invoiceid
        description: "Primary key of the source system table"
        data_tests:
          - unique
          - not_null
      - name: customerid
        description: "Customer ID of the customer billed"
        data_tests:
          - not_null
      - name: invoicedate
        description: "Date of the invoice"
        data_tests:
          - not_null
      - name: billingaddress
        description: "Billing street address"
      - name: billingcity
        description: "Billing city"
      - name: billingstate
        description: "Billing state or province"
      - name: billingcountry
        description: "Billing country"
      - name: billingpostalcode
        description: "Billing postal code"
      - name: total
        description: "Invoice total"
        data_tests:
          - not_null

  - name: dim_track
    description: "One row per track."
    columns:
      - name: trackkey
        description: "Dimension key"
        data_tests:
          - unique
          - not_null
      - name: trackid
        description: "Primary key of the source system table"
        data_tests:
          - unique
          - not_null
      - name: trackname
        description: "Name of the track"
        data_tests:
          - not_null
      - name: album
        description: "Album the track belongs to"
      - name: artist
        description: "Artist of the track"
      - name: mediatype
        description: "Track's media type"
      - name: genre
        description: "Track's genre"
      - name: composer
        description: "Composer of the track"
      - name: lengthms
        description: "Length of track in milliseconds"
        data_tests:
          - not_null
      - name: sizebytes
        description: "Size of track in bytes"
      - name: unitprice
        description: "Price of the track"
        data_tests:
          - not_null
